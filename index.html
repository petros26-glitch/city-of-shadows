<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d17" />
    <meta name="description" content="COS - City of Shadows. An original African open-world action-adventure game." />
    <title>COS — City of Shadows</title>
  </head>
  <body>
    <main id="game-root" aria-label="City of Shadows 3D game preview">
      <div id="loading-screen" role="status">LOADING CITY OF SHADOWS<span></span></div>
      <div id="game-error" role="alert" hidden></div>
      <section class="game-brand" aria-label="Game title">
        <p class="eyebrow">AN ORIGINAL OPEN-WORLD EXPERIENCE</p>
        <h1>CITY <span>OF</span> SHADOWS</h1>
        <p class="game-subtitle">DREAM. STRUGGLE. RISE.</p>
      </section>
      <div class="scene-hint">LEFT STICK TO MOVE <span>·</span> DRAG RIGHT SIDE TO LOOK</div>
      <div class="build-label">EARLY GAMEPLAY · BUILD 0.2.0</div>

      <section id="mobile-controls" aria-label="Game controls">
        <div id="move-joystick" class="joystick-base" aria-label="Movement joystick">
          <span class="joystick-ring"></span>
          <span id="move-stick" class="joystick-stick"></span>
        </div>
        <div class="action-controls">
          <button id="action-interact" class="game-control secondary-control" type="button" aria-label="Interact">E</button>
          <button id="action-jump" class="game-control jump-control" type="button" aria-label="Jump">JUMP</button>
        </div>
      </section>

      <section id="rotate-prompt" role="status" aria-live="polite">
        <div class="rotate-icon" aria-hidden="true"><span></span></div>
        <p class="rotate-eyebrow">CITY OF SHADOWS</p>
        <h2>TURN YOUR PHONE</h2>
        <p>For the best experience, play COS in landscape mode.</p>
        <span class="rotate-hint">ROTATE YOUR DEVICE HORIZONTALLY</span>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
