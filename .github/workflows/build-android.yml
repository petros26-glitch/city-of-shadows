name: Build COS Android APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "index.html"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build landscape Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out COS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Build COS web game
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Lock Android app to landscape
        run: node scripts/set-android-landscape.mjs

      - name: Sync COS into Android app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Upload COS APK
        uses: actions/upload-artifact@v4
        with:
          name: COS-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
